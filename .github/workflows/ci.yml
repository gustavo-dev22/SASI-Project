name: CI/CD - Build, Seguridad y Deploy SASI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ----------------------------------------------------
  # JOB 1: Validación y Seguridad
  # ----------------------------------------------------
  build-and-scan:
    name: Build .NET 8 y Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SASI/SASI.sln

      - name: Build Release
        run: dotnet build SASI/SASI.sln --configuration Release --no-restore -warnaserror

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------
  # JOB 2: Publicación y Despliegue (Solo en push a master)
  # ----------------------------------------------------
  deploy:
    name: Deploy a MonsterASP
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Compila el proyecto web principal generando los binarios y el web.config
      - name: Publish SASI MVC
        run: dotnet publish SASI/*.csproj -c Release -o ./publish-sasi

      # Sube los binarios compilados a la raíz /wwwroot/
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SASI_SERVER }}
          username: ${{ secrets.FTP_SASI_USERNAME }}
          password: ${{ secrets.FTP_SASI_PASSWORD }}
          local-dir: ./publish-sasi/
          server-dir: /wwwroot/
